name: check

# Fast sanity checks without data/raw/. The full build + deploy is deploy.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Python scripts compile
        run: python -m compileall -q scripts
      - name: Worker syntax
        run: node --check worker/index.js
      - name: Committed JSON parses
        run: |
          python - <<'PY'
          import json, pathlib, sys
          bad = []
          for p in list(pathlib.Path("site").glob("*.json")) + list(pathlib.Path("data").glob("*.json")):
              try:
                  json.loads(p.read_text(encoding="utf-8"))
              except Exception as e:
                  bad.append(f"{p}: {e}")
          print("\n".join(bad) or "all JSON ok")
          sys.exit(1 if bad else 0)
          PY
      - name: Radicals table is complete
        run: |
          python - <<'PY'
          import json, sys
          R = json.load(open("data/radicals.json", encoding="utf-8"))
          bad = []
          if [r["n"] for r in R] != list(range(1, 215)):
              bad.append("numbers are not 1..214")
          for r in R:
              if not (r["char"] and r["ru"] and r["en"] and r["strokes"] > 0 and r["pinyin"]):
                  bad.append(f"{r['n']}: empty field")
              if any(len(v) != 1 for v in r["variants"]):
                  bad.append(f"{r['n']}: variant is not one character")
          if sum(r["top"] for r in R) < 30:
              bad.append("too few common radicals")
          print("\n".join(bad) or "radicals ok")
          sys.exit(1 if bad else 0)
          PY
      - name: Home page has what the app needs
        run: |
          grep -q 'id="phrase"' site/index.html
          grep -q "fetch('phrase.json')" site/index.html
          test -s site/phrase.json && test -s site/glyphs.json
