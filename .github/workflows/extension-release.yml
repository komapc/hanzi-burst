name: extension-release

# Uploads the extension zips that are live on hanzi.lipu.dev to the Chrome Web Store and,
# when publish=true, submits the Firefox build to addons.mozilla.org (AMO has no upload-only mode).
# The zip is built and deployed by deploy.yml (wrangler.toml [build] runs build_extension.py --zip).
#
# Release flow (see README "Деплой"):
#   1. bump "version" in extension/manifest.json, merge to main (deploy.yml deploys it)
#   2. git tag v<version> && git push origin v<version>
#      -> deploy.yml deploys that commit (if it is main's HEAD), then calls this workflow with publish=true
# Run by hand (Actions -> extension-release -> Run workflow) to re-upload the live zip.
#
# Needs repository secrets: CWS_EXTENSION_ID, CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN
# (Chrome Web Store API OAuth, see https://github.com/fregante/chrome-webstore-upload-keys);
# AMO_JWT_ISSUER, AMO_JWT_SECRET (https://addons.mozilla.org/developers/addon/api/key/) — the
# Firefox job is skipped with a warning until they are set.
on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      publish:
        description: "Submit for review (and auto-publish) after upload"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Check secrets are set
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          for v in CWS_EXTENSION_ID CWS_CLIENT_ID CWS_CLIENT_SECRET CWS_REFRESH_TOKEN; do
            [ -n "${!v}" ] || { echo "::error::secret $v is not set"; exit 1; }
          done
      - name: Download the deployed package
        run: curl -fsSL -o extension.zip https://hanzi.lipu.dev/hanzi-burst-extension.zip
      - name: Package version matches manifest (and tag)
        run: |
          zipv=$(unzip -p extension.zip manifest.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          repov=$(python3 -c 'import json; print(json.load(open("extension/manifest.json"))["version"])')
          echo "zip=$zipv repo=$repov ref=$GITHUB_REF_NAME"
          [ "$zipv" = "$repov" ] || { echo "::error::deployed zip is $zipv but manifest.json is $repov: run build_extension.py --zip and wrangler deploy first"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$repov" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match manifest version $repov"; exit 1
          fi
      - name: Upload to the Chrome Web Store
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          flags=""
          [ "$PUBLISH" = true ] && flags="--auto-publish"
          set +e
          npx --yes chrome-webstore-upload-cli@3 upload --source extension.zip $flags 2>&1 | tee upload.log
          status=${PIPESTATUS[0]}
          set -e
          # A previous version still in review (or approved but unpublished) blocks uploads: that's
          # a wait-and-retry, not a broken release, so warn instead of failing the run.
          if [ "$status" -ne 0 ] && grep -q ITEM_NOT_UPDATABLE upload.log; then
            msg="Chrome Web Store is not accepting uploads: the previous version is pending review or ready to publish. Publish or cancel it in the Developer Dashboard, then re-run this workflow."
            echo "::warning::$msg"
            echo "### ⚠️ Upload skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Re-running a release whose version is already published is a no-op, not a failure.
          if [ "$status" -ne 0 ] && grep -q PKG_INVALID_VERSION_NUMBER upload.log; then
            msg="Chrome Web Store already has this version; nothing was uploaded."
            echo "::warning::$msg"
            echo "### ⚠️ Chrome: version already in the store" >> "$GITHUB_STEP_SUMMARY"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$status"

  firefox:
    if: inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check secrets are set
        id: secrets
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -n "$AMO_JWT_ISSUER" ] && [ -n "$AMO_JWT_SECRET" ]; then
            # Shape check without printing the values: the issuer looks like user:12345678:123 and the
            # secret is a 64-char hex string. Pasting them swapped or with whitespace gives AMO's
            # unhelpful "Unknown JWT iss (issuer)".
            iss=$(printf %s "$AMO_JWT_ISSUER" | tr -d '[:space:]'); sec=$(printf %s "$AMO_JWT_SECRET" | tr -d '[:space:]')
            [ "$iss" = "$AMO_JWT_ISSUER" ] && [ "$sec" = "$AMO_JWT_SECRET" ] || echo "::warning::AMO secrets contain whitespace; it is stripped"
            [[ "$iss" =~ ^user:[0-9]+:[0-9]+$ ]] || { echo "::error::AMO_JWT_ISSUER is not of the form user:<digits>:<digits> (length ${#iss}); is it the secret, or from another field?"; exit 1; }
            [[ "$sec" =~ ^[0-9a-f]{64}$ ]] || echo "::warning::AMO_JWT_SECRET is not 64 hex chars (length ${#sec})"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            msg="AMO_JWT_ISSUER / AMO_JWT_SECRET are not set: Firefox was not submitted. Upload hanzi-burst-firefox.zip by hand (README, «Выпуск новой версии расширения»)."
            echo "::warning::$msg"
            echo "### ⚠️ Firefox skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Download the deployed Firefox package
        if: steps.secrets.outputs.ok
        run: |
          curl -fsSL -o firefox.zip https://hanzi.lipu.dev/hanzi-burst-firefox.zip
          mkdir ff && unzip -q firefox.zip -d ff
          zipv=$(python3 -c 'import json; print(json.load(open("ff/manifest.json"))["version"])')
          repov=$(python3 -c 'import json; print(json.load(open("extension/manifest.json"))["version"])')
          echo "zip=$zipv repo=$repov"
          [ "$zipv" = "$repov" ] || { echo "::error::deployed Firefox zip is $zipv but manifest.json is $repov"; exit 1; }
      # Listed add-ons are never signed automatically: web-ext uploads, AMO validates and queues the
      # version for human review, and the run ends there (--approval-timeout 0 = don't wait for it).
      - name: Submit to addons.mozilla.org
        if: steps.secrets.outputs.ok
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          export WEB_EXT_API_KEY=$(printf %s "$WEB_EXT_API_KEY" | tr -d '[:space:]')
          export WEB_EXT_API_SECRET=$(printf %s "$WEB_EXT_API_SECRET" | tr -d '[:space:]')
          set +e
          npx --yes web-ext@8 sign --channel listed --source-dir ff --artifacts-dir web-ext-artifacts \
            --approval-timeout 0 2>&1 | tee sign.log
          status=${PIPESTATUS[0]}
          set -e
          # Re-running a release whose version AMO already has is a no-op, not a failure.
          if [ "$status" -ne 0 ] && grep -qiE 'version .*already exists|Duplicate add-on version' sign.log; then
            msg="addons.mozilla.org already has this version; nothing was submitted."
            echo "::warning::$msg"
            echo "### ⚠️ Firefox: version already on AMO" >> "$GITHUB_STEP_SUMMARY"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$status"
