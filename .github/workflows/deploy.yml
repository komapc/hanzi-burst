name: deploy

# Builds the site + extension zip and deploys the Worker to hanzi.lipu.dev.
#   push to main    -> deploy
#   push of tag v*  -> deploy (only if the tag is on main's current HEAD), then upload the extension to the
#                      Chrome Web Store (extension-release.yml)
#   pull_request    -> same build and browser tests, `wrangler deploy --dry-run` (nothing is published)
#
# The build reads data/raw/ (dictionaries, gitignored). CI takes a pinned snapshot of the files it
# needs from the GitHub release RAW_DATA_TAG; see README "Деплой" for how to refresh it.
#
# Needs repository secret CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers" + D1 edit).
# Worker secrets (GOOGLE_CLIENT_ID, SESSION_SECRET, GEMINI_API_KEY, IP_HASH_SECRET) live in Cloudflare and are kept on deploy.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RAW_DATA_TAG: raw-data-2026-10-25b
  RAW_DATA_SHA256: fabbda88064cdaffe28f26569cefd8040f1ce5d2e21516d0302bcc737d6769dd
  CLOUDFLARE_ACCOUNT_ID: a4f85dfdebcf5fa0a516297f9c6dc029
  WRANGLER_VERSION: 4.151.3

jobs:
  # Unit tests and sanity checks (check.yml) gate the deploy.
  check:
    uses: ./.github/workflows/check.yml

  deploy:
    needs: check
    runs-on: ubuntu-latest
    # Never cancel a deploy halfway; PR dry-runs may cancel each other.
    # Tag runs get their own group: in the shared 'deploy' group a queued tag run was replaced (cancelled)
    # by a newer main push, and extension-release never ran. Since a tag run can then overlap a main run,
    # it only deploys when the tag is main's HEAD (both deploy the same code); see "Tag is main's HEAD".
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('deploy-pr-{0}', github.ref) || startsWith(github.ref, 'refs/tags/') && format('deploy-tag-{0}', github.ref) || 'deploy' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      # A tag on an older commit must not roll prod back: main's own run has deployed (or is deploying) newer code.
      # The live-zip check and extension-release still run and fail if the live zip's version doesn't match the tag.
      - name: Tag is main's HEAD
        id: head
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          main=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$main" = "$GITHUB_SHA" ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::tag $GITHUB_REF_NAME is $GITHUB_SHA, main is $main: not redeploying an old commit"; echo "deploy=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Python build deps
        run: python -m pip install --quiet Pillow==13.0.0   # pinned like playwright/wrangler; bump deliberately
      - uses: actions/setup-node@v7
        with:
          node-version: 22   # wrangler 4.151+ requires Node >= 22
      - name: Cache raw data snapshot
        id: raw-cache
        uses: actions/cache@v6
        with:
          path: raw-data.tar.xz
          key: ${{ env.RAW_DATA_TAG }}
      - name: Download raw data snapshot
        if: steps.raw-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$RAW_DATA_TAG" -R "$GITHUB_REPOSITORY" -p raw-data.tar.xz
      - name: Unpack into data/raw/
        run: |
          echo "$RAW_DATA_SHA256  raw-data.tar.xz" | sha256sum -c -
          mkdir -p data/raw
          tar -xJf raw-data.tar.xz -C data/raw
      # Built once here (scripts/build_all.sh, the same as wrangler.toml [build]) so the browser tests check the
      # very files that get deployed; wrangler then skips its own build (HB_BUILT).
      - name: Build
        run: sh scripts/build_all.sh
      - name: Browser tests (tests/e2e)
        run: |
          python -m pip install --quiet playwright==1.61.0
          python -m playwright install --with-deps chromium
          python -m unittest discover -s tests/e2e -v
      - name: Deploy (dry run)
        if: github.event_name == 'pull_request'
        env:
          HB_BUILT: "1"
        run: |
          npx --yes "wrangler@$WRANGLER_VERSION" deploy --dry-run --outdir dist
          unzip -l site/hanzi-burst-extension.zip | tail -1
      - name: Deploy
        if: github.event_name != 'pull_request' && steps.head.outputs.deploy != 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HB_BUILT: "1"
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::secret CLOUDFLARE_API_TOKEN is not set"; exit 1; }
          npx --yes "wrangler@$WRANGLER_VERSION" deploy
      - name: Live site serves this build's extension zip
        if: github.event_name != 'pull_request'
        run: |
          want=$(python3 -c 'import json; print(json.load(open("extension/manifest.json"))["version"])')
          for i in 1 2 3 4 5 6; do
            got=$(curl -fsSL https://hanzi.lipu.dev/hanzi-burst-extension.zip -o live.zip && unzip -p live.zip manifest.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])') || got=none
            [ "$got" = "$want" ] && { echo "live zip is $got"; exit 0; }
            sleep 10
          done
          echo "::error::hanzi.lipu.dev serves extension $got, expected $want"; exit 1

  extension-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: deploy
    uses: ./.github/workflows/extension-release.yml
    with:
      publish: true
    secrets: inherit
