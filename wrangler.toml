name = "hanzi-burst"
main = "worker/index.js"
compatibility_date = "2025-01-01"

routes = [{ pattern = "hanzi.lipu.dev", custom_domain = true }]   # workers.dev остаётся рабочим
workers_dev = true

# Статика сайта и API живут на одном домене: куки работают без CORS.
[build]
command = "python3 -I scripts/build_shards.py && python3 -I scripts/build_static.py"   # шарды для вставки текста, страницы /c/, /p/ и sitemap.xml

[assets]
directory = "./site"
binding = "ASSETS"
# /api/* и файл подтверждения Google уходят в Worker, остальное отдаётся из site/
run_worker_first = ["/api/*", "/googled1d667f41fecd0d0.html"]

[[d1_databases]]
binding = "DB"
database_name = "hanzi-burst"
database_id = "2e760b4f-cb72-4e82-96f1-470c590ae6fd"

[vars]
GEMINI_MODEL = "gemini-2.5-flash"
EXPLAIN_DAILY_LIMIT = "15"      # новых запоминалок в сутки на пользователя (или IP)
GLOBAL_DAILY_LIMIT = "300"      # на весь сайт в сутки

# Секреты (wrangler secret put ...):
#   GOOGLE_CLIENT_ID   OAuth Web client ID (публичный, но не хардкодим)
#   SESSION_SECRET     случайная строка 32+ байт для подписи куки
#   GEMINI_API_KEY     ключ Gemini API
