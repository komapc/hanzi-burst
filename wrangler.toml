name = "hanzi-burst"
main = "worker/index.js"
compatibility_date = "2025-01-01"

routes = [{ pattern = "hanzi.lipu.dev", custom_domain = true }]
# workers.dev отдаёт тот же сайт, но с X-Robots-Tag: noindex (site/_headers) и canonical на hanzi.lipu.dev
workers_dev = true

# Статика сайта и API живут на одном домене: куки работают без CORS.
[build]
# scripts/build_all.sh; CI (deploy.yml) builds and runs the browser tests first, then deploys with HB_BUILT=1
command = "[ -n \"$HB_BUILT\" ] || sh scripts/build_all.sh"

[assets]
directory = "./site"
binding = "ASSETS"
# Worker вызывается только для API и файлов подтверждения (их нужно отдать по точному адресу, без 307 на путь
# без .html). Остальную статику Cloudflare отдаёт сам: она не тратит дневной лимит Workers (100 тыс. на аккаунт,
# общий с vortaro). 301 на канонические адреса — site/_redirects (scripts/redirects.py), http -> https — зона.
run_worker_first = ["/api/*", "/googled1d667f41fecd0d0.html", "/yandex_075f1191e804f3a2.html"]
# несуществующие пути: статус 404 и страница site/404.html (иначе пустое тело)
not_found_handling = "404-page"

[[d1_databases]]
binding = "DB"
database_name = "hanzi-burst"
database_id = "2e760b4f-cb72-4e82-96f1-470c590ae6fd"

[vars]
GEMINI_MODEL = "gemini-2.5-flash"
EXPLAIN_DAILY_LIMIT = "15"      # новых запоминалок в сутки на пользователя (или IP)
GLOBAL_DAILY_LIMIT = "300"      # на весь сайт в сутки — отдельно запоминалки и переводы (итого до 2×)

# Секреты (wrangler secret put ...):
#   GOOGLE_CLIENT_ID   OAuth Web client ID (публичный, но не хардкодим)
#   SESSION_SECRET     случайная строка 32+ байт для подписи куки
#   GEMINI_API_KEY     ключ Gemini API
#   IP_HASH_SECRET     случайная строка 32+ байт: ключ HMAC для анонимных счётчиков по IP (без него — несолёный хэш)
