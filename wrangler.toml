name = "hanzi-burst"
main = "worker/index.js"
compatibility_date = "2025-01-01"

routes = [{ pattern = "hanzi.lipu.dev", custom_domain = true }]   # workers.dev отвечает 301 на hanzi.lipu.dev (кроме /api/* и файла Google)
workers_dev = true

# Статика сайта и API живут на одном домене: куки работают без CORS.
[build]
# шарды для вставки текста (китайские и японские) и кандзи японского режима, страницы /c/, /p/ и sitemap.xml, zip расширения (нужны data/raw/ и Pillow)
command = "python3 -I scripts/build_shards.py && python3 -I scripts/build_ja_shards.py && python3 -I scripts/build_kanji_shards.py && python3 -I scripts/build_static.py && python3 -I scripts/build_extension.py --zip && python3 -I scripts/minify.py"

[assets]
directory = "./site"
binding = "ASSETS"
# Все запросы сначала идут в Worker: он редиректит workers.dev на hanzi.lipu.dev,
# обслуживает /api/* и файл подтверждения Google, остальное отдаёт из site/ через ASSETS.
run_worker_first = true
# несуществующие пути: статус 404 и страница site/404.html (иначе пустое тело)
not_found_handling = "404-page"

[[d1_databases]]
binding = "DB"
database_name = "hanzi-burst"
database_id = "2e760b4f-cb72-4e82-96f1-470c590ae6fd"

[vars]
GEMINI_MODEL = "gemini-2.5-flash"
EXPLAIN_DAILY_LIMIT = "15"      # новых запоминалок в сутки на пользователя (или IP)
GLOBAL_DAILY_LIMIT = "300"      # на весь сайт в сутки

# Секреты (wrangler secret put ...):
#   GOOGLE_CLIENT_ID   OAuth Web client ID (публичный, но не хардкодим)
#   SESSION_SECRET     случайная строка 32+ байт для подписи куки
#   GEMINI_API_KEY     ключ Gemini API
