<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
<header>
  <img src="icons/48.png" alt="" width="36" height="36">
  <div><h1>Hanzi Burst</h1><p>Chinese characters, broken down</p></div>
</header>
<main>
  <label class="line">
    <span>Enabled</span>
    <input type="checkbox" id="on" class="sw">
  </label>

  <div class="group">
    <div class="cap">Show card on</div>
    <div class="seg" id="mode">
      <button data-v="select">Selection</button>
      <button data-v="hover">Mouse hover</button>
    </div>
  </div>

  <div class="group">
    <div class="cap">Translations</div>
    <div class="seg" id="lang">
      <button data-v="auto">Auto</button>
      <button data-v="en">English</button>
      <button data-v="ru">Русский</button>
    </div>
  </div>

  <label class="line">
    <span>Turn off on <b id="host">this site</b></span>
    <input type="checkbox" id="site" class="sw">
  </label>
</main>
<footer>Everything runs locally. No data leaves your browser.</footer>
<script src="popup.js"></script>
