<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Мои иероглифы — Hanzi Burst</title>
<style>
:root{--bg:#faf7f2;--fg:#1f1b16;--muted:#6b6257;--accent:#c8402a;--line:#cfc6b6;--soft:#e6dfd3;--card:#fff;--ok:#2a7f51;--info:#2f6fd0;--warn:#d09a1f}
@media(prefers-color-scheme:dark){:root{--bg:#17140f;--on:#17140f;--fg:#f1ebe0;--muted:#a59c8e;--accent:#ff7a5c;--line:#5a5144;--soft:#352f25;--card:#221e17;--ok:#5fcf93;--info:#6aa6ff;--warn:#e8b84a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 60px}
a{color:var(--accent)}h1{font-size:26px;margin:.4em 0 .2em}h2{font-size:16px;margin:1.8em 0 .6em;display:flex;align-items:baseline;gap:8px}
h2 small{color:var(--muted);font-weight:400}
.lang button{background:none;border:1px solid var(--soft);color:var(--muted);padding:3px 10px;font:inherit;font-size:.85rem;cursor:pointer}
.lang button:first-child{border-radius:999px 0 0 999px}.lang button:last-child{border-radius:0 999px 999px 0}
.lang button.on{background:var(--accent);border-color:var(--accent);color:var(--on,#fff)}
.m{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.c{display:block;text-align:center;padding:8px 6px 6px;border:1px solid var(--soft);border-radius:12px;background:var(--card);color:var(--fg);text-decoration:none;position:relative}
.c:hover{border-color:var(--accent)}
.c svg{width:44px;height:44px;display:block;margin:0 auto}
.c .p{font-size:.72rem;color:var(--muted)}.c .d{font-size:.7rem;color:var(--muted);line-height:1.2;max-height:2.4em;overflow:hidden}
.c.k::after,.c.a::after,.c.s::after{content:"";position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--ok)}
.c.a::after{background:var(--info)}.c.s::after{background:var(--warn)}
.hsk{display:grid;gap:6px;margin:14px 0 4px}
.lv{display:grid;grid-template-columns:4.2em 1fr 6.5em;align-items:center;gap:10px;width:100%;padding:4px 6px;border:0;border-radius:8px;background:none;color:var(--fg);font:inherit;font-size:.9rem;text-align:left;cursor:pointer}
.lv:hover,.lv.on{background:var(--soft)}
.lv b{font-weight:600}.lv small{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:999px;background:var(--soft);overflow:hidden}.lv:hover .bar,.lv.on .bar{background:var(--card)}
.bar i{display:block;height:100%;background:var(--ok);border-radius:inherit}
.todo{margin:6px 0 14px}.todo h2{margin-top:.8em}
.empty{padding:20px;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}.empty p{margin:0}
.empty .go{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.gb{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:999px;background:var(--accent);color:var(--bg);text-decoration:none;font-weight:600}.gb.alt{background:none;color:var(--accent);border:1px solid var(--accent)}
</style><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "7efcd1cc733b4eaf8c293f32b705fbf7"}'></script>
</head><body><main>
<nav class="tn" id="sitenav"><span class="lang"><button data-lang="ru">RU</button><button data-lang="en">EN</button></span></nav><script src="/nav.js"></script>
<h1 id="h1"></h1><p class="m" id="sum"></p>
<h2 id="hskH"></h2><div class="hsk" id="hsk"></div><div class="todo" id="todo"></div>
<div id="out"></div>
<div id="sitefoot"></div><script src="/footer.js" defer></script>
</main>
<script src="script.js"></script>
<script>
const T = {
  ru:{title:'Мои иероглифы',back:'← Hanzi Burst',known:'Известные иероглифы',parts:'Части (радикалы) в известных иероглифах',ready:'Готовы к изучению: все части известны',some:'Знаю часть частей',
      empty:'Пока ничего не отмечено. Открой иероглиф во фразе и нажми «Знаю». Ключи, выученные в игре, тоже попадают сюда.',goPh:'К фразам',goGame:'Учить ключи в игре',loading:'Загружаю…',
      sum:(n,p,r)=>`Известно иероглифов: ${n}. Частей в них: ${p}. Готово к изучению: ${r}.`,
      hint:'Список хранится только в этом браузере.', partKnown:'отмечена', partMet:'встречается',
      hsk:'Прогресс по уровням HSK 3.0', todo:n=>`HSK ${n}: ещё не знаю`, all:'Все знаки этого уровня отмечены 🎉'},
  en:{title:'My characters',back:'← Hanzi Burst',known:'Known characters',parts:'Parts (radicals) inside known characters',ready:'Ready to learn: all parts known',some:'Some parts known',
      empty:'Nothing marked yet. Open a character in a phrase and press “Know it”. Radicals you learn in the game show up here too.',goPh:'Go to phrases',goGame:'Learn radicals in the game',loading:'Loading…',
      sum:(n,p,r)=>`Known characters: ${n}. Parts inside them: ${p}. Ready to learn: ${r}.`,
      hint:'The list is stored only in this browser.', partKnown:'marked', partMet:'seen',
      hsk:'Progress by HSK 3.0 level', todo:n=>`HSK ${n}: not yet known`, all:'Every character of this level is marked 🎉'},
};
let lang = 'ru', known = [];
try { lang = localStorage.getItem('hanzi-lang') || (navigator.language.startsWith('ru') ? 'ru' : 'en'); } catch (e) {}
try { known = JSON.parse(localStorage.getItem('hanzi-known') || '[]'); } catch (e) {}
const t = k => T[lang][k];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D = { chars: {} }, G = {}, ready = false;
const shardKey = ch => ch.codePointAt(0).toString(16).slice(0, -2);
const cache = {};
const shard = (kind, k) => cache[kind + k] || (cache[kind + k] = fetch(`data/${kind}/${k}.json`).then(r => r.ok ? r.json() : {}).catch(() => ({})));
async function load(chars) {
  let need = [...chars];
  const done = new Set();
  while (need.length) {
    const batch = need.filter(c => !done.has(c)); need = [];
    batch.forEach(c => done.add(c));
    await Promise.all([...new Set(batch.map(shardKey))].map(async k => {
      const cd = await shard('chars', k);
      batch.filter(c => shardKey(c) === k).forEach(c => {
        if (!cd[c]) return;
        D.chars[c] = cd[c];
        (cd[c].components || []).forEach(x => { if (!done.has(x)) need.push(x); });
      });
    }));
  }
}
const hz = ch => G[ch] ? `<svg viewBox="0 0 1024 1024" role="img" aria-label="${esc(ch)}"><g transform="scale(1,-1) translate(0,-900)">${G[ch].map(d => `<path d="${d}" fill="currentColor"/>`).join('')}</g></svg>` : `<div class="fz" data-c="${esc(ch)}" style="font-size:34px;line-height:44px">${esc(ch)}</div>`;
/* контуры: data/g/<кодпоинт >> 4>.json (по 16 знаков) — только для показанных карточек */
async function fillGlyphs() {
  const els = [...document.querySelectorAll('.fz[data-c]')];
  const keys = [...new Set(els.map(e => e.dataset.c).filter(c => !G[c]).map(c => (c.codePointAt(0) >> 4).toString(16)))];
  await Promise.all(keys.map(async k => Object.assign(G, await shard('g', k))));
  els.forEach(e => { if (e.isConnected && G[e.dataset.c]) e.outerHTML = hz(e.dataset.c); });
}
const def = ch => { const c = D.chars[ch] || {}; return (lang === 'ru' && c.definition_ru) || c.definition || ''; };
const short = d => (d || '').split(/[;,]/)[0].trim();
const cardHtml = (ch, cls) => `<a class="c ${cls || ''}" href="${lang === 'en' ? '/en/' : '/'}?open=${encodeURIComponent(ch)}"><span class="p">${esc(((D.chars[ch] || {}).pinyin || [])[0] || '')}</span>${hz(ch)}<span class="d">${esc(short(def(ch)))}</span></a>`;
const kset = () => new Set(known);
function leaves(ch, ks) {   // {total, got} по листовым частям
  let total = 0, got = 0;
  const walk = (c, cov, depth) => {
    const comps = (D.chars[c] || {}).components || [];
    if (!comps.length || depth > 6) { total++; if (cov || ks.has(c)) got++; return; }
    comps.forEach(x => walk(x, cov || ks.has(x), depth + 1));
  };
  ((D.chars[ch] || {}).components || []).forEach(x => walk(x, ks.has(x), 1));
  return { total, got };
}
function leafSet(ch, acc, depth = 0) {
  const comps = (D.chars[ch] || {}).components || [];
  if (!comps.length || depth > 6) { if (depth) acc.add(ch); return acc; }
  comps.forEach(x => leafSet(x, acc, depth + 1));
  return acc;
}
/* прогресс по HSK: data/hsk.json — знаки каждого уровня (частые первыми); клик по уровню — неотмеченные знаки */
let HSK = null, openLv = 0;
const lvName = n => n === '7' ? '7–9' : n;
function renderHsk() {
  $hskH.textContent = t('hsk');
  if (!HSK) return;
  const ks = kset();
  $hsk.innerHTML = Object.entries(HSK).map(([n, cs]) => {
    const got = [...cs].filter(c => ks.has(c)).length, all = [...cs].length;
    return `<button class="lv${openLv === n ? ' on' : ''}" data-lv="${n}" aria-expanded="${openLv === n}"><b>HSK ${lvName(n)}</b><span class="bar"><i style="width:${(100 * got / all).toFixed(1)}%"></i></span><small>${got} / ${all}</small></button>`;
  }).join('');
  if (!openLv) { $todo.innerHTML = ''; return; }
  const rest = [...HSK[openLv]].filter(c => !ks.has(c));
  $todo.innerHTML = `<h2>${t('todo')(lvName(openLv))} <small>${rest.length}</small></h2>` +
    (rest.length ? `<div class="grid">${rest.map(c => cardHtml(c, '')).join('')}</div>` : `<p class="m">${t('all')}</p>`);
  fillGlyphs();
}
function render() {
  renderHsk();
  document.documentElement.lang = lang;
  document.title = t('title') + ' — Hanzi Burst';
  $h1.textContent = t('title');
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
  if (!known.length) {   // пустой список: куда идти дальше — к фразам или в игру с ключами
    const en = lang === 'en';
    $out.innerHTML = `<div class="empty"><p>${t('empty')}</p><p class="go"><a class="gb" href="/${en ? 'en/' : ''}">${t('goPh')}</a>`
      + `<a class="gb alt" href="/radicals-game?lang=${lang}">${t('goGame')}</a></p></div>`;
    $sum.textContent = ''; return;
  }
  if (!ready) { $out.innerHTML = `<p class="m">${t('loading')}</p>`; return; }
  const ks = kset();
  const parts = new Set();
  known.forEach(c => leafSet(c, parts));
  // кандидаты: иероглифы, которые мы знаем по данным (ядро + части известных), но ещё не отмечены
  const cand = Object.keys(D.chars).filter(c => !ks.has(c) && (D.chars[c].components || []).length);
  const rdy = [], som = [];
  cand.forEach(c => { const r = leaves(c, ks); if (r.total && r.got === r.total) rdy.push(c); else if (r.got) som.push(c); });
  $sum.textContent = T[lang].sum(known.length, parts.size, rdy.length) + ' ' + t('hint');
  const sec = (title, arr, cls) => arr.length ? `<h2>${title} <small>${arr.length}</small></h2><div class="grid">${arr.map(c => cardHtml(c, cls)).join('')}</div>` : '';
  $out.innerHTML = sec(t('known'), known, 'k') +
    sec(t('parts'), [...parts].sort(), '') +
    sec(t('ready'), rdy.slice(0, 60), 'a') +
    sec(t('some'), som.slice(0, 60), 's');
  fillGlyphs();
}
const $hskH = document.getElementById('hskH'), $hsk = document.getElementById('hsk'), $todo = document.getElementById('todo');
$hsk.onclick = async e => {
  const b = e.target.closest('.lv'); if (!b) return;
  openLv = openLv === b.dataset.lv ? 0 : b.dataset.lv; renderHsk();
  if (openLv) { const lv = openLv; await load([...HSK[lv]].filter(c => !D.chars[c])); if (openLv === lv) renderHsk(); }
};
const $h1 = document.getElementById('h1'), $sum = document.getElementById('sum'), $out = document.getElementById('out');
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => { lang = b.dataset.lang; try { localStorage.setItem('hanzi-lang', lang); } catch (e) {} render(); });
render();
// расширение Hanzi Burst объединило свой список с нашим (см. extension/content.js) или список поменяли в другой вкладке.
// Эта страница список только читает, поэтому устаревшей копией ничего не затрёт.
const reloadKnown = async () => {
  try { known = JSON.parse(localStorage.getItem('hanzi-known') || '[]'); } catch (e) { return; }
  render(); await load(known.filter(c => !D.chars[c])); render();
};
window.addEventListener('hanzi-known', reloadKnown);
window.addEventListener('storage', e => { if (e.key === 'hanzi-known' && e.newValue !== null) reloadKnown(); });
(async () => {
  try {
    D.chars = (await fetch('phrase.json').then(r => r.json())).chars;
  } catch (e) { window.__err = String(e); }
  HSK = await fetch('data/hsk.json').then(r => r.json()).catch(() => null);
  await load(known.filter(c => !D.chars[c]));
  ready = true; render();
})();
</script></body></html>
